# Minimal static-file server for the generated dashboard.
# Serves the SAME reports/ directory the "generator" container writes into
# (shared Docker volume — see docker-compose.yml). This container never runs
# the Python pipeline itself; it only serves whatever the generator most
# recently wrote, which is why the "generator" service mounts the volume
# read-write and this one mounts it read-only.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The dashboard is meant for you, over your own tailnet — never let it
    # be indexed if it's ever reachable from anywhere less private.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Baseline hardening headers (defence in depth — the real access control
    # here is "only reachable over Tailscale", not this container).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Before the very first scheduled run completes, reports/ is empty —
    # a plain, honest message instead of nginx's default 404 page.
    error_page 404 /_not_ready.html;
    location = /_not_ready.html {
        internal;
        return 200 "Kenyan Stock Analyzer\n\nNo dashboard has been generated yet.\nThe scheduled job runs at the time set by SCHEDULE_CRON (default: 16:00 Africa/Nairobi, weekdays).\n\nTo generate one right now:\n  docker compose exec generator python3 docker_scheduled_run.py --ignore-calendar\n";
        default_type text/plain;
    }

    location ~ /\. {
        deny all;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
